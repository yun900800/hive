name: Booking Reconcile

on:
  schedule:
    # 每 5 分钟巡检：到期未签退 → 自动签退；确认后 15 分钟未到 → NO_SHOW
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile overdue bookings
        run: |
          curl -fsS -X GET "${{ secrets.VERCEL_URL }}/api/booking/reconcile" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
